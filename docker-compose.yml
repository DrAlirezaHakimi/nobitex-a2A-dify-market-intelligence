services:
  nobitex-a2a-integrated:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    environment:
      MARKET_MODE: ${MARKET_MODE:-demo}
      API_KEY: ${API_KEY:?Set API_KEY to a strong secret in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      DIFY_API_BASE: ${DIFY_API_BASE:-https://api.dify.ai/v1}
      MAX_PARALLEL: ${MAX_PARALLEL:-12}
      MAX_DEEP: ${MAX_DEEP:-300}
      MARKET_TTL: ${MARKET_TTL:-70}
    volumes:
      - ./data:/srv/data
    security_opt:
      - no-new-privileges:true
