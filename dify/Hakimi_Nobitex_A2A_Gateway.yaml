app:
  description: درگاه Dify به سرویس چندعاملی A2A نوبیتکس؛ نمایش BUY/SELL/HOLD فقط در
    حالت تحلیل
  icon: 📊
  icon_background: '#E4FBF0'
  mode: workflow
  name: Hakimi A2A - All Symbols Market Intelligence
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: کلید محرمانه API_KEY در فایل محلی .env سرویس A2A؛ پس از Import مقدار را در Dify Studio تنظیم کنید.
    id: c6b1f0b2-3a7d-4f8c-9e2b-7d4a1f5c8b30
    name: A2A_API_KEY
    selector:
    - env
    - A2A_API_KEY
    value: ''
    value_type: secret
  features:
    opening_statement: ''
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
    file_upload:
      enabled: false
  graph:
    edges:
    - id: start-to-http
      type: custom
      source: start
      target: http
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: start
        targetType: http-request
        isInIteration: false
    - id: http-to-calc
      type: custom
      source: http
      target: calc
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: http-request
        targetType: code
        isInIteration: false
    - id: calc-to-end
      type: custom
      source: calc
      target: end
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: code
        targetType: end
        isInIteration: false
    nodes:
    - id: start
      type: custom
      position:
        x: 60
        y: 150
      positionAbsolute:
        x: 60
        y: 150
      width: 244
      height: 54
      data:
        title: ورودی تحلیل چندبازاری
        type: start
        desc: آدرس سرویس امن؛ اتصال Cloud به localhost ممکن نیست
        variables:
        - variable: backend_url
          label: HTTPS Backend Base URL
          type: text-input
          required: true
          max_length: 200
          default: https://replace-with-your-active-ngrok-domain.ngrok-free.dev
        - variable: top_k
          label: نمایش چند فرصت برتر
          type: select
          required: true
          options:
          - '5'
          - '10'
          - '15'
          default: '10'
    - id: http
      type: custom
      position:
        x: 380
        y: 150
      positionAbsolute:
        x: 380
        y: 150
      width: 244
      height: 90
      data:
        title: اسکن همه نمادها توسط سرویس A2A
        type: http-request
        desc: سرویس خارجی اردربوک all و آمار را جمع‌آوری، تمام نمادها را غربال و عامل‌ها
          را هماهنگ می‌کند
        method: get
        url: '{{#start.backend_url#}}/api/scan?top_k={{#start.top_k#}}'
        authorization:
          type: no-auth
          config: null
        headers: 'X-API-Key: {{#env.A2A_API_KEY#}}'
        params: ''
        body:
          type: none
          data: []
        timeout:
          connect: 15
          read: 60
          write: 15
        retry_config:
          retry_enabled: false
          max_retries: 0
          retry_interval: 1000
    - id: calc
      type: custom
      position:
        x: 700
        y: 150
      positionAbsolute:
        x: 700
        y: 150
      width: 244
      height: 80
      data:
        title: گزارش خوانا و بدون سفارش
        type: code
        desc: قواعد قطعی؛ بدون سفارش
        code_language: python3
        variables:
        - variable: body
          value_selector:
          - http
          - body
        - variable: status_code
          value_selector:
          - http
          - status_code
        code: "import json\n\ndef main(body: str, status_code: int) -> dict:\n   \
          \ if int(status_code) != 200:\n        raise ValueError('A2A backend returned\
          \ HTTP '+str(status_code))\n    payload = json.loads(body) if isinstance(body,\
          \ str) else body\n    if not isinstance(payload,dict) or not isinstance(payload.get('metrics'),dict):\n\
          \        raise ValueError('Invalid A2A response, no metrics')\n    if payload.get('mode')\
          \ not in ('demo','live'):\n        raise ValueError('Unknown market data\
          \ mode')\n    m = payload['metrics']\n    report = ['Nobitex A2A – منبع:\
          \ '+payload['mode'].upper(),\n              'نمادهای غربال‌شده: '+str(m.get('screened',0)),\n\
          \              'نمادهای تحلیل‌شده با A2A: '+str(m.get('a2a_evaluated',0)),\n\
          \              'داده‌های نمایشی' if payload['mode']=='demo' else 'داده عمومی\
          \ واقعی، بدون تضمین اعتبار سیگنال',\n              'اجرای واقعی معامله غیرفعال\
          \ است.']\n    for name,key in [('خرید اکتشافی','best_buy'),('فروش صرفاً\
          \ از موجودی فعلی','best_sell')]:\n        item=payload.get(key)\n      \
          \  report.append(name+': '+item['symbol']+' | نمره '+str(item['score'])\
          \ if item else name+': عدم معامله')\n    keys=('project','mode','data_status','generated_at','execution_enabled','metrics',\n\
          \          'best_buy','best_sell','recommendation','opportunities','market_universe','excluded_examples','method')\n\
          \    compact={key:payload.get(key) for key in keys}\n    return {'report':'\\\
          n'.join(report),'raw_json':json.dumps(compact,ensure_ascii=False,allow_nan=False)}\n"
        outputs:
          report:
            type: string
            children: null
          raw_json:
            type: string
            children: null
    - id: end
      type: custom
      position:
        x: 1020
        y: 150
      positionAbsolute:
        x: 1020
        y: 150
      width: 244
      height: 54
      data:
        title: خروجی گزارش چندعاملی
        type: end
        desc: بدون معامله واقعی
        outputs:
        - variable: report
          value_selector:
          - calc
          - report
        - variable: details_json
          value_selector:
          - calc
          - raw_json
    viewport:
      x: 0
      y: 0
      zoom: 0.65